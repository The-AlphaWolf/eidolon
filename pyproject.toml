[project]
name = "eidolon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "pyflakes>=3.4,<4"]
llm = ["anthropic"]  # Phase 5: only needed for a live model (`eidolon play --llm`); the test suite never imports it
web = ["starlette>=1.3,<2", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<0.1", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29"]  # Phase 8: `eidolon serve`; httpx for the test client
# The exact versions every measurement in docs/ was taken with: requirements-tested.txt (NR-N13)

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eidolon*"]
